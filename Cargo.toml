[package]
name = "soundsync"
version = "2.9.0"
edition = "2021"
description = "Bluetooth A2DP Sink with DSP EQ, WebRTC streaming, and Web UI"
license = "MIT"

[[bin]]
name = "soundsync"
path = "src/main.rs"

[dependencies]
# Bluetooth
bluer = { version = "0.17", features = ["full"] }
zbus = { version = "4", features = ["tokio"] }
zvariant = "4"

# Audio
# pipewire = "0.8" # Used via subprocess, not linked directly
opus = "0.3"
mp3lame-encoder = "0.2"

# Chromecast
rust_cast = "0.19"
mdns-sd = "0.11"

# DSP
rustfft = "6.2"

# WebRTC
webrtc = "0.12"
rtp = "0.12"
bytes = "1"
rustls = { version = "0.23", features = ["ring"] }

# Web
axum = { version = "0.7", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
libc = "0.2"

[dev-dependencies]
tokio-test = "0.4"

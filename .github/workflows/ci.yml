name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev libopus-dev pkg-config
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test -- --test-threads=1
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: soundsync-linux-amd64
          path: target/debug/soundsync

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: webui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: soundsync-webui
          path: webui/dist

  release:
    name: Build Release Binary
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev libpipewire-0.3-dev libspa-0.2-dev libclang-dev libopus-dev pkg-config
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: soundsync-webui
          path: webui/dist
      - name: Build release binary
        run: cargo build --release
      - name: Upload release binary
        uses: actions/upload-artifact@v4
        with:
          name: soundsync-release-linux-amd64
          path: target/release/soundsync
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/soundsync
          generate_release_notes: true
